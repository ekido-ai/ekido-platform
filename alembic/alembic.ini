# Database migrations for the Platform API. This file lives inside alembic/ so the server's auto-deploy, which syncs
# whole folders, carries it. The database comes from DATABASE_URL (see env.py), never from
# this file, so no credentials live in the repository.
#   cd apps/platform && DATABASE_URL=postgresql+psycopg://... python -m alembic -c alembic/alembic.ini upgrade head
[alembic]
script_location = %(here)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
