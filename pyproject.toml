[project]
name = "ekido-platform"
version = "0.1.0"
description = "Ekido Platform API: accounts, teams, API keys, quotes, payments and plans"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "fpdf2>=2.8,<3",  # GST invoice PDFs (ticket C8)
]

[project.optional-dependencies]
# Sign-in emails through Amazon SES (EMAIL_SENDER=ses); the default "log" sender needs nothing.
ses = ["boto3>=1.34"]
dev = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
